<!doctype html>
<!-- Temporary control page for the Chrome-on-iPhone scroll bug: plain HTML, none of the site's
     code. If this page also gets stuck short of the top, the cause is Chrome, not the site. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll test</title>
    <style>
      body { margin: 0; font: 16px/1.5 Georgia, serif; background: #F6EFE2; color: #2A2621; }
      .top { height: 600px; background: #21473C; color: #FAF6EE; padding: 24px; }
      .block { height: 400px; padding: 24px; border-bottom: 1px solid #ccc; }
      .block:nth-child(odd) { background: #f0e9dc; }
      #out {
        position: fixed; top: 8px; right: 8px; margin: 0; padding: 6px 8px;
        background: rgba(0, 0, 0, 0.75); color: #7CFC9A; font: 11px/1.35 ui-monospace, Menlo, monospace;
        border-radius: 4px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="top"><h1>PLAIN TEST PAGE</h1><p>Top of page. Scroll down, then back up.</p></div>
    <div>
      <div class="block">1</div><div class="block">2</div><div class="block">3</div>
      <div class="block">4</div><div class="block">5</div><div class="block">6</div>
    </div>
    <pre id="out"></pre>
    <script>
      var out = document.getElementById('out');
      var minY = Infinity;
      function read() {
        var vv = window.visualViewport;
        minY = Math.min(minY, scrollY);
        out.textContent =
          'PLAIN PAGE\nscrollY ' + Math.round(scrollY) + '  min ' + Math.round(minY) +
          '\ninnerH ' + innerHeight + '  screenH ' + screen.height +
          '\nvv h ' + (vv ? Math.round(vv.height) : '-') + ' pageTop ' + (vv ? Math.round(vv.pageTop) : '-');
      }
      read();
      addEventListener('scroll', read, { passive: true });
      addEventListener('resize', read);
      setInterval(read, 500);
    </script>
  </body>
</html>
